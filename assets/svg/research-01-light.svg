<svg xmlns="http://www.w3.org/2000/svg" width="430" height="168" viewBox="0 0 430 168" role="img" aria-label="01. Execution state across action chunks. Keeping a fast, chunked VLA policy aware of task progress and of the motion it was in the middle of. ChainVLA, under review, co-first.">
